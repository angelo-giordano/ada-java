services:
  api:
    build: .
    image: ada/biblioteca:latest
    container_name: biblioteca-api
    environment:
      - SERVER_PORT=420
    networks:
      - appnet

  nginx:
    image: xcgd/nginx-vts:1.16.1-0.1.18
    container_name: nginx-proxy
    depends_on:
      - api
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      #- ./nginx/cache:/data/nginx/cache
      - ./nginx/certs:/etc/nginx/certs:ro
    tmpfs:
      - /data/nginx/cache:size=100m,mode=0755
    networks:
      - appnet

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - appnet

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - appnet

volumes:
  grafana_data:

networks:
  appnet:
    driver: bridge
