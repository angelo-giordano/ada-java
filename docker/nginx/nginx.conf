# Usa o número de CPUs disponíveis automaticamente
worker_processes auto;

events {
  # Máximo de conexões simultâneas por worker
  worker_connections 1024;
}

http {
  # Upstream da aplicação Spring Boot
  upstream api_backend {
    server api:420;
  }

  # Formato de log estruturado:
  # request_id | IP | "método [data] uri protocolo" | status | tempo de resposta do upstream
  log_format main '$request_id $remote_addr "$request_method [$time_local] $request_uri $server_protocol" '
                  '$status $upstream_response_time';
  access_log /var/log/nginx/access.log main;

  # Zona de rate limiting: chave por IP, 10MB de memória, limite de 5 req/s
  limit_req_zone $binary_remote_addr zone=limit:10m rate=5r/s;

  # Headers de segurança injetados em todas as respostas
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header "X-XSS-Protection" "1; mode=block";

  # Cache em disco: zona "mycache" com 10MB de metadados, 100MB de dados,
  # expira entradas não acessadas em 10s
  proxy_cache_path /data/nginx/cache keys_zone=mycache:10m max_size=100m inactive=10s use_temp_path=off;

  # Zona de métricas de tráfego (exposta em /status para o Prometheus)
  vhost_traffic_status_zone;

  server {
    listen              443 ssl;
    server_name         biblioteca-ada.com;

    ssl_certificate     /etc/nginx/certs/biblioteca-ada.com.crt;
    ssl_certificate_key /etc/nginx/certs/biblioteca-ada.com.key;

    # Requisições bloqueadas pelo rate limit retornam 429
    limit_req_status 429;

    # Compressão GZIP para JSON e texto puro
    gzip       on;
    gzip_types text/plain application/json;

    # Limite de payload: rejeita uploads acima de 1MB com 413
    client_max_body_size 1M;

    # Cache ativo para requisições GET com resposta 200, válido por 10s
    proxy_cache         mycache;
    proxy_cache_methods GET;
    proxy_cache_valid   200 10s;

    # Não cacheia requisições com header Authorization
    proxy_no_cache      $http_authorization;
    proxy_cache_bypass  $http_authorization;

    # Qualquer rota não mapeada retorna 404
    location / {
      return 404;
    }

    # Health check do próprio Nginx (não passa pelo backend)
    location /health {
      add_header Content-Type application/json;
      return 200 '{"status":"ok","component":"nginx"}';
    }

    # Health check da aplicação => sujeito a rate limiting, sem cache
    location /actuator/health {
      proxy_set_header Host $host;
      limit_req zone=limit burst=10 nodelay;
      proxy_pass http://api_backend;
    }

    # Rotas da API => rate limiting, cache e rastreamento por request_id
    location /api/ {
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;  # Propagado ao backend para rastreamento

      limit_req zone=limit burst=10 nodelay;  # Burst de 10 sem delay, excedente retorna 429

      proxy_pass http://api_backend;

      add_header X-Request-Id $request_id;           # Expõe o ID na resposta para o cliente
      add_header X-Cache-Status $upstream_cache_status;  # HIT, MISS ou BYPASS
    }

    # Métricas de tráfego expostas no formato Prometheus
    location /status {
      vhost_traffic_status_display;
      vhost_traffic_status_display_format prometheus;
      allow all;
    }
  }
}
