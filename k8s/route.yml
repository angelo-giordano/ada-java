apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: health-direct-response
  namespace: biblioteca
spec:
  directResponse:
    statusCode: 200
    contentType: application/json
    body:
      type: Inline
      inline: '{"status":"ok","component":"envoy"}'
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: biblioteca-client-policy
  namespace: biblioteca
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gateway
  connection:
    bufferLimit: 1Mi
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: biblioteca-route
  namespace: biblioteca
spec:
  parentRefs:
  - name: gateway
    namespace: default
  hostnames:
  - biblioteca-ada.com
  rules:
  - matches:
    - path:
        type: Exact
        value: /health
    filters:
    - type: ExtensionRef
      extensionRef:
        group: gateway.envoyproxy.io
        kind: HTTPRouteFilter
        name: health-direct-response

  - matches:
    - path:
        type: PathPrefix
        value: /actuator/health
    backendRefs:
    - name: biblioteca-svc
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: biblioteca-api-route
  namespace: biblioteca
spec:
  parentRefs:
  - name: gateway
    namespace: default
  hostnames:
  - biblioteca-ada.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        set:
        - name: X-Content-Type-Options
          value: nosniff
        - name: X-Frame-Options
          value: DENY
        - name: X-XSS-Protection
          value: "1; mode=block"
    backendRefs:
    - name: biblioteca-svc
      port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: actuator-traffic-policy
  namespace: biblioteca
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: biblioteca-route
  rateLimit:
    type: Local
    local:
      rules:
      - limit:
          requests: 5
          unit: Second
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: api-traffic-policy
  namespace: biblioteca
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: biblioteca-api-route
  rateLimit:
    type: Local
    local:
      rules:
      - limit:
          requests: 5
          unit: Second
